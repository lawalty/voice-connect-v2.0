[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-connect-library"
version = "1.0.0"
description = "Voice Connect document management, retrieval and ingestion"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = [
  "certifi==2026.7.22",
  "charset-normalizer==3.4.9",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "lxml==6.1.1",
  "markdown-it-py==4.2.0",
  "pydantic==2.13.4",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "pypdf==6.15.0",
  "reportlab==4.4.10",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "pglast==8.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
vc-library-api = "app.main:run"
vc-library-worker = "app.worker:run"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["static/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
