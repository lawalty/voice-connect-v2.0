name: voice-connect-v2
services:
  app:
    image: voice-connect-v2:${VC_RELEASE:?Set immutable VC_RELEASE}
    build:
      context: .
      dockerfile: ops/Dockerfile
    network_mode: host
    environment:
      NODE_ENV: production
      VC_HOST: 127.0.0.1
      VC_PORT: 18880
      VC_ORIGIN: https://srv2003889.hstgr.cloud
      VC_STATE_DIR: /state
      VC_GATEWAY_URL: ws://127.0.0.1:18789
      VC_GATEWAY_ADMIN: ${VC_GATEWAY_ADMIN:-false}
      VC_GATEWAY_MODEL: openai/gpt-6-astra
      VC_IMAGE_MODEL_ALLOWLIST: openai/gpt-6-astra,openai/gpt-6-sol,openai/gpt-6-luna
      VC_GATEWAY_TOKEN_FILE: /run/secrets/gateway-token
      VC_MASTER_KEY_FILE: /run/secrets/master-key
      VC_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      VC_VOSK_URL: http://127.0.0.1:27017
      VC_VOSK_TOKEN_FILE: /run/secrets/vosk-token
      VC_FISH_MODEL: ${VC_FISH_MODEL:-s2.1-pro}
      VC_LIBRARY_URL: https://srv2003889.hstgr.cloud
      VC_LIBRARY_TOKEN_FILE: /run/secrets/library-token
      VC_BUILD: ${VC_RELEASE}
    volumes:
      - /opt/voice-connect-v2/state:/state
      - /opt/voice-connect-v2/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18880/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  vosk:
    image: voice-connect-vosk:${VC_RELEASE:?Set immutable VC_RELEASE}
    build:
      context: .
      dockerfile: ops/vosk/Dockerfile
    network_mode: host
    environment:
      VC_VOSK_MODEL_DIR: /models
      VC_VOSK_TOKEN_FILE: /run/secrets/vosk-token
    volumes:
      - /opt/voice-connect-v2/models:/models
      - /opt/voice-connect-v2/secrets/vosk-token:/run/secrets/vosk-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:27017/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  library-api:
    image: voice-connect-library:${VC_RELEASE:?Set immutable VC_RELEASE}
    build:
      context: ./library
      dockerfile: Dockerfile
    network_mode: host
    command: [uvicorn, "app.main:create_app", --factory, --host, "127.0.0.1", --port, "18881"]
    env_file: /opt/voice-connect-v2/library/rag.env
    environment:
      RAG_INLINE_WORKER: "false"
      RAG_PUBLIC_BASE_URL: https://srv2003889.hstgr.cloud
      RAG_VOICE_CONNECT_AUTH_URL: http://127.0.0.1:18880/api/status
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18881/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  library-worker:
    profiles: [library-worker]
    image: voice-connect-library:${VC_RELEASE:?Set immutable VC_RELEASE}
    network_mode: host
    command: [vc-library-worker]
    env_file: /opt/voice-connect-v2/library/rag.env
    environment:
      RAG_INLINE_WORKER: "false"
      RAG_PUBLIC_BASE_URL: https://srv2003889.hstgr.cloud
      RAG_VOICE_CONNECT_AUTH_URL: http://127.0.0.1:18880/api/status
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      library-api:
        condition: service_healthy
  edge:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    network_mode: host
    volumes:
      - /opt/voice-connect-v2/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/voice-connect-v2/caddy-data:/data
      - /opt/voice-connect-v2/caddy-config:/config
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
