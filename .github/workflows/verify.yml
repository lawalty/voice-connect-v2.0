name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run prepare:assets
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/vosk/requirements.txt
      - run: python -m pip install -r library/requirements-deploy.lock 'pytest==9.1.1' 'pytest-asyncio==1.4.0' 'pglast==8.4'
      - run: python -m pytest
        working-directory: library
      - run: node checks/audio-browser.mjs
      - run: node checks/audio-barge-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          retention-days: 7
